[project]
name = "cronograph"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "argon2-cffi>=23.1.0",
    "email-validator>=2.2.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "polars>=1.40.1",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.0",
    "pyjwt[crypto]>=2.10.0",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.49",
    "sse-starlette>=3.4.2",
    "structlog>=25.5.0",
    "typer>=0.15.0",
    "uvicorn>=0.46.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.152.4",
    "mypy>=2.0.0",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true

