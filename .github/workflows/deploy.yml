name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 30m
          script_stop: true
          script: |
            # One-shot cleanup to clear any orphaned containers from previous failed deploys.
            # Safe to run every time — only removes stopped/conflicting containers.
            docker rm -f $(docker ps -aq --filter "name=cronograph-") 2>/dev/null || true
            docker container prune -f 2>/dev/null || true
            bash /opt/cronograph/scripts/deploy.sh
