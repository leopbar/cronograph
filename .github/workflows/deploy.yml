name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    env:
      VPS_ENV: ${{ secrets.VPS_ENV }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 30m
          script_stop: true
          envs: VPS_ENV
          script: |
            # Write production env file (safe with special chars via printf)
            printf '%s' "$VPS_ENV" > /opt/cronograph/.env.production
            chmod 600 /opt/cronograph/.env.production

            # One-shot cleanup to clear any orphaned containers from previous failed deploys.
            docker rm -f $(docker ps -aq --filter "name=cronograph-") 2>/dev/null || true
            docker container prune -f 2>/dev/null || true
            bash /opt/cronograph/scripts/deploy.sh
