services:
  db:
    image: timescale/timescaledb:latest-pg17
    container_name: cronograph-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - cronograph_db_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cronograph-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - PYTHONPATH=src
      - SECRET_KEY=${SECRET_KEY}
      - ACCESS_TTL_MIN=${ACCESS_TTL_MIN:-15}
      - REFRESH_TTL_DAYS=${REFRESH_TTL_DAYS:-14}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN}
      - CORS_ORIGINS=${CORS_ORIGINS}
    ports:
      - "8003:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}/api
    container_name: cronograph-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3003:3000"

volumes:
  cronograph_db_data:
